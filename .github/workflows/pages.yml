name: Publish live demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: [frontend/**, backend/src/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency: pages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cd backend && npm test
      - name: Build static site
        run: |
          mkdir -p site/backend
          cp -r frontend/. site/
          cp backend/src/*.mjs site/backend/
          touch site/.nojekyll
      - name: Publish to gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish live demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
