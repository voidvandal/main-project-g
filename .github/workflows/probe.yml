name: Check AWS access

on:
  workflow_dispatch:
    inputs:
      regions:
        description: Space-separated regions to check
        default: ap-south-1 us-east-1 us-west-2 eu-west-1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe services (read-only)
        env:
          RAW_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RAW_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PROBE_REGIONS: ${{ inputs.regions }}
        run: |
          export AWS_ACCESS_KEY_ID=$(printf '%s' "$RAW_ID" | tr -d '[:space:]"'"'")
          export AWS_SECRET_ACCESS_KEY=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]"'"'")
          echo "::add-mask::$AWS_ACCESS_KEY_ID"; echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          pip install -q boto3
          python3 scripts/probe_services.py
