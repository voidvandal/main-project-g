name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region to deploy to
        default: ''
  push:
    branches: [main]

concurrency: deploy

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.region || vars.AWS_REGION || 'ap-south-1' }}
      HAS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.ADMIN_KEY != '' }}
    steps:
      - name: Check secrets
        if: env.HAS_KEYS != 'true'
        run: |
          echo "::notice::Add AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and ADMIN_KEY under Settings > Secrets and variables > Actions, then re-run."
          echo "Deployment skipped: repository secrets are not set yet." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'

      - name: Run tests
        if: env.HAS_KEYS == 'true'
        run: cd backend && npm test

      - uses: aws-actions/setup-sam@v2
        if: env.HAS_KEYS == 'true'
        with:
          use-installer: true

      - name: Check and load AWS keys
        if: env.HAS_KEYS == 'true'
        env:
          RAW_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RAW_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Strip spaces, line breaks and quotes that sneak in when pasting.
          ID=$(printf '%s' "$RAW_ID" | tr -d '[:space:]"'"'")
          SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]"'"'")
          echo "::add-mask::$ID"; echo "::add-mask::$SECRET"
          ok=1
          if ! [[ "$ID" =~ ^(AKIA|ASIA)[A-Z0-9]{16}$ ]]; then
            ok=0
            if [[ "$SECRET" =~ ^(AKIA|ASIA)[A-Z0-9]{16}$ ]]; then
              echo "::error::The two keys look swapped. AWS_ACCESS_KEY_ID should be the short key starting with AKIA."
            else
              echo "::error::AWS_ACCESS_KEY_ID should be 20 characters starting with AKIA (got ${#ID} characters)."
            fi
          fi
          if [ "${#SECRET}" -ne 40 ]; then
            ok=0
            echo "::error::AWS_SECRET_ACCESS_KEY should be exactly 40 characters (got ${#SECRET})."
          fi
          [ "$ok" = 1 ] || exit 1
          {
            echo "AWS_ACCESS_KEY_ID=$ID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET"
            echo "AWS_DEFAULT_REGION=$AWS_REGION"
          } >> "$GITHUB_ENV"
          export AWS_ACCESS_KEY_ID="$ID" AWS_SECRET_ACCESS_KEY="$SECRET" AWS_DEFAULT_REGION="$AWS_REGION"
          aws sts get-caller-identity >/dev/null && echo "AWS accepted the keys" || {
            echo "::error::AWS rejected these keys. Create a new access key in IAM and paste it again."; exit 1; }

      - name: Deploy
        if: env.HAS_KEYS == 'true'
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: ./scripts/deploy.sh
