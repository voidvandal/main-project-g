<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SeatSpot · Library Seats</title>
  <meta name="description" content="Live library seat availability. Scan the QR on a desk to check in." />
  <meta name="theme-color" content="#0f766e" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M9 20v-7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v7M7 20h18M10 20v4M22 20v4' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>SeatSpot</h1>
        <p class="sub">Central Library · live seats</p>
      </div>
    </div>
    <div class="summary" id="summary" aria-live="polite">
      <strong id="freeCount">–</strong><span>free of <span id="totalCount">–</span></span>
    </div>
  </header>

  <section id="mySeat" class="my-seat" hidden>
    <div>
      <p class="label">Your seat</p>
      <p class="my-id" id="myId"></p>
      <p class="my-timer" id="myTimer"></p>
    </div>
    <div class="my-actions">
      <button class="btn" data-act="extend">I'm still here</button>
      <button class="btn ghost" data-act="break">Break · 20 min</button>
      <button class="btn danger" data-act="checkout">Leave</button>
    </div>
  </section>

  <nav class="controls">
    <div class="tabs" id="floorTabs" role="tablist"></div>
    <label class="toggle"><input type="checkbox" id="powerOnly" /> <span>⚡ Power socket</span></label>
  </nav>

  <ul class="legend" aria-label="Legend">
    <li><i class="dot free"></i>Free</li>
    <li><i class="dot occupied"></i>Taken</li>
    <li><i class="dot away"></i>On a break</li>
    <li><i class="dot reported"></i>Reported empty</li>
  </ul>

  <main id="zones" class="zones" aria-busy="true">
    <p class="loading">Loading seats…</p>
  </main>

  <footer class="foot">
    <span id="updated">—</span> · Seats auto-release when timers run out ·
    <a href="qr.html">Desk QR codes</a>
  </footer>

  <dialog id="seatDialog">
    <form method="dialog" id="seatForm">
      <h2 id="dlgTitle"></h2>
      <p class="muted" id="dlgMeta"></p>
      <div id="dlgBody"></div>
      <p class="error" id="dlgError" role="alert"></p>
      <menu id="dlgActions"></menu>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
